<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>One Toolbar Shortcut</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
      min-width: 320px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .checkbox-row input {
      margin: 0;
    }
  </style>
</head>
<body>
  <label class="checkbox-row" for="open-new-tab">
    <input type="checkbox" id="open-new-tab">
    Open site in a new tab
  </label>
  <script src="options.js"></script>
</body>
</html>
